[project]
name = "argus-code-review"
dynamic = ["version"]
description = "Self-orchestrated PR review agent using LangGraph + Claude Agent SDK"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Redesign Health" }]
requires-python = ">=3.12,<3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    # PyPI's license badge and license-filter still read the trove
    # classifier, not the SPDX `license` field above -- keep both until
    # PyPI's SPDX migration is complete.
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # Claude Agent SDK for orchestrator + subagent dispatch.
    # Pinned to ==0.1.81: regenerating the lock on a sliding
    # exclude-newer window would otherwise downgrade to 0.1.75 and
    # potentially miss API surface added in 0.1.76+.
    "claude-agent-sdk==0.1.81",
    # LangGraph for pipeline orchestration
    "langgraph>=1.0.10,<2",
    "langgraph-checkpoint-postgres>=2.0.0",
    # SQLite checkpointer used by the HTTP-storage mode path in graph.py
    # when the sandbox can't reach Postgres on :5432.
    "langgraph-checkpoint-sqlite>=2.0.0",
    # psycopg[binary] bundles a precompiled libpq, so tests and the
    # Postgres checkpointer path (argus/graph.py) don't depend on a
    # system libpq install. Without it, psycopg falls back to its pure
    # Python ctypes implementation, which fails to import on macOS
    # runners that don't ship libpq (ubuntu-latest happens to have it
    # preinstalled, which is why this only broke macOS CI).
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    # LangChain for structured LLM calls
    "langchain>=1.2.10,<2",
    "langchain-anthropic>=1.2.0",
    # LangSmith for Agent SDK session tracing
    "langsmith>=0.2.0,<1",
    # HTTP client (GitHub API, storage HTTP shim)
    "httpx>=0.27.0",
    # OpenAI SDK for the plan-extraction fallback path
    "openai>=1.50.0",
    # Per-token model pricing table (argus/llm/pricing.py) -- single source
    # of truth for $/token rates, instead of a hand-maintained duplicate.
    "litellm>=1.50.0,<2.0.0",
    # Postgres storage backend (history + checkpoints)
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    # Pydantic for data contracts + configuration
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # .env support (argus.dotenv_utils)
    "python-dotenv>=1.0.0",
]

[project.urls]
Repository = "https://github.com/redesignhealth/argus-review"
Issues = "https://github.com/redesignhealth/argus-review/issues"
Changelog = "https://github.com/redesignhealth/argus-review/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio<=0.21.2",
    "pytest-httpx>=0.30.0",
    "mypy>=1.10.0",
    "ruff>=0.8.0",
    # For argus.precheck.engine's direct `import yaml` (the prechecks
    # extra's own pyyaml dependency ships no type stubs).
    "types-PyYAML>=6.0",
]
# Deterministic-precheck rule engine (argus.precheck). Optional: without it
# installed, the precheck node no-ops instead of failing the pipeline --
# see argus/precheck/__init__.py. Kept separate from `dev` because it's a
# runtime dependency for anyone who wants prechecks, not a test-only tool.
prechecks = [
    # Upper-bounded: argus.precheck.engine depends on empirically verified
    # semgrep behavior (exit code 0 with or without findings, non-zero only
    # on semgrep's own execution errors; SARIF artifactLocation.uri echoing
    # the scan-root path form verbatim; --no-rewrite-rule-ids reporting the
    # bare `id:` value regardless of directory nesting, which is what makes
    # select_rule_statuses' DB lookup by rule_id work at all) that a future
    # major release isn't contractually obligated to preserve. Bump
    # deliberately, re-verifying all three behaviors, rather than picking it
    # up silently.
    "semgrep>=1.90.0,<2.0.0",
    # engine._find_duplicate_rule_ids parses rule YAML directly for the
    # duplicate-id lint -- declared explicitly rather than relying on
    # semgrep's own transitive PyYAML dependency, which this code has no
    # contractual guarantee of.
    "pyyaml>=6.0",
    # argus.precheck.actions_scanner depends on empirically verified zizmor
    # CLI behavior (--format sarif emitting real SARIF 2.1.0; exit 0 with or
    # without findings; exit 3 with a "no inputs collected" stderr substring
    # specifically for the empty-input case, distinct from other non-zero
    # exits) that a future major release isn't contractually obligated to
    # preserve. Bump deliberately, re-verifying all three, rather than
    # picking it up silently -- same discipline as the semgrep pin above.
    "zizmor>=1.29.0,<2.0.0",
    # argus.precheck.terraform_scanner depends on empirically verified
    # Checkov behavior (exit 0 only when clean, exit 1 when genuine
    # findings exist -- the OPPOSITE of semgrep/zizmor's "always 0"
    # convention; `--output sarif` writing real SARIF only to a file via
    # `--output-file-path`, never to stdout; the specific check ids in
    # terraform_scanner._ALLOWED_CHECKS existing and firing on a generic
    # wildcard IAM policy) that a future major release isn't contractually
    # obligated to preserve. Bump deliberately, re-verifying all three,
    # rather than picking it up silently -- same discipline as semgrep/
    # zizmor above. Checkov's own transitive dependency tree is
    # significantly heavier than semgrep/zizmor's (a full IaC-parsing
    # toolchain) -- accepted here since it's the one tool in this
    # extra that isn't a standalone binary and genuinely needs pip.
    "checkov>=3.3.0,<4.0.0",
]

# squawk (Postgres migrations -- migration_scanner.py), actionlint (GitHub
# Actions syntax/shellcheck -- workflow_lint_scanner.py), and Trivy
# (secrets -- secrets_scanner.py) are standalone binaries, NOT PyPI
# packages -- pip/uv cannot install them, so they aren't (and can't be)
# listed above. eslint + eslint-plugin-security (JS/TS --
# js_scanner.py) are npm packages, installed into their own bundled
# directory (argus/precheck/eslint_bundle/), also outside pip's reach.
# All four must be installed separately wherever this package runs live
# -- see docs/PRECHECKS.md's "stock rule sources" section for exact
# versions this project has verified against and install instructions.
# Every scanner here degrades gracefully (skips its own scan, logs once)
# when its binary/bundle is absent -- see each module's own
# `*_available()` check.
# semgrep pins mcp==1.23.3 exactly, so uv's single flat resolution (which
# must satisfy every extra combination at once) locks mcp -- and its own
# transitives jsonschema/importlib-metadata/pywin32 -- to that version for
# EVERY install of this package, not just prechecks users. This is provably
# safe, not a functional regression: claude-agent-sdk (core, always
# installed) only requires mcp>=1.19.0, and 1.23.3 satisfies that floor, so
# nothing here depends on an mcp feature added after 1.23.3. Investigated
# uv's `conflicts` mechanism (declaring dev/prechecks mutually exclusive) as
# a way to fork the resolution and keep the newer mcp for non-prechecks
# installs -- it has no effect here, because 1.23.3 already satisfies both
# constraints simultaneously; there's no genuine incompatibility for uv to
# fork around, just a tighter shared pin.

[project.scripts]
argus = "argus.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
# --strict-markers turns unregistered @pytest.mark.<name> typos into errors.
addopts = ["-m", "not integration", "--strict-markers"]
markers = [
    "integration: marks tests as integration tests (require a live external resource -- DB, network, or a real binary; skipped by default)",
    "needs_real_github_token: marks integration tests that need a real GITHUB_TOKEN_RO in the environment, unstubbed by tests/conftest.py's autouse fixture",
    "packaging: marks tests that build the wheel via `uv build` (slow; shells out)",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "claude_agent_sdk",
    "claude_agent_sdk.*",
    "langgraph.*",
    "langchain.*",
    "langchain_anthropic.*",
    "langchain_core.*",
]
ignore_missing_imports = true

# Tests intentionally build partial/untyped fixtures (plain dicts standing in
# for TypedDict state, small untyped helper functions) — relax the handful of
# strict-mode flags that would otherwise require annotating every test helper
# and casting every fixture dict to the full ReviewState/AsyncSession shape.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
implicit_reexport = true
disallow_any_generics = false
disable_error_code = ["arg-type"]

# argus.cli exposes stdlib modules (threading/time/os) as attributes for
# test-time patching (patch.object(cli.threading, "Thread", ...)); allow
# that without requiring an explicit __all__.
[[tool.mypy.overrides]]
module = "argus.cli"
implicit_reexport = true

[tool.ruff]
target-version = "py312"
line-length = 100

[build-system]
# hatchling>=1.24 is required for the `license-files` PEP 639 field above --
# an older hatchling would silently omit LICENSE from the wheel.
requires = ["hatchling>=1.24", "hatch-vcs"]
build-backend = "hatchling.build"

# Single-sourced version: derived from the git tag (e.g. `v0.1.0` -> `0.1.0`)
# rather than a hand-maintained literal. With no tags yet in this repo, this
# resolves to a `0.1.dev<N>+g<sha>`-style dev version — see docs/RELEASING.md.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["argus"]
# argus/prompts/*.md and any other package-relative data files are included
# by hatchling's default wheel packaging (whole-package copy) — no extra
# `include`/`force-include` needed. Verified by tests/test_packaging.py.
# schema/*.sql is intentionally NOT packaged into the wheel: it lives outside
# the `argus` package and ships as repo/sdist content only (Postgres DDL for
# self-hosters running the postgres storage backend). See docs/RELEASING.md.
# CHANGELOG.md is the same story: docs-only, not a runtime resource `argus`
# imports, so it ships in the sdist below but not the wheel.

[tool.hatch.build.targets.sdist]
include = [
    "/argus",
    "/schema",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]
