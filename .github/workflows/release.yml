name: Release

# Tag-triggered release: build sdist + wheel, checksum them, and attach both
# to a GitHub release. PyPI/TestPyPI publish steps exist but are inert
# (gated behind repo vars) until D7 (distribution channel) is decided — see
# docs/RELEASING.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release + upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.classify.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from the tag; needs full history
          # (and the tag itself) rather than a shallow checkout.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest

      - name: Build sdist + wheel
        run: uv build

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum ./* > SHA256SUMS

      - name: Classify tag (rc vs stable)
        id: classify
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$TAG_NAME" == *rc* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          prerelease: ${{ steps.classify.outputs.is_prerelease }}
          generate_release_notes: true

  publish-testpypi:
    # rc tags only, and only once PyPI publishing is enabled (D7). Inert
    # (skipped) until the `PUBLISH_PYPI` repo variable is set to "true".
    needs: build
    if: vars.PUBLISH_PYPI == 'true' && needs.build.outputs.is_prerelease == 'true'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # OIDC trusted publishing — no API token stored
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Remove checksum file before upload
        run: rm -f dist/SHA256SUMS
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    # Stable (non-rc) tags only, and only once PyPI publishing is enabled
    # (D7). Inert (skipped) until the `PUBLISH_PYPI` repo variable is set
    # to "true" — see docs/RELEASING.md for the enablement checklist.
    needs: build
    if: vars.PUBLISH_PYPI == 'true' && needs.build.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC trusted publishing — no API token stored
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Remove checksum file before upload
        run: rm -f dist/SHA256SUMS
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
