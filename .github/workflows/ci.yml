name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Version is derived from git tags via hatch-vcs (see
          # pyproject.toml [tool.hatch.version]); `uv sync` builds the
          # local package, so it needs full tag history, not the default
          # shallow (depth-1) clone.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-extras
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy .

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        # Plain CLI, not gitleaks/gitleaks-action: the Action wrapper
        # requires a paid GITLEAKS_LICENSE for any GitHub organization
        # account (redesignhealth is one), even on a public repo. The
        # underlying CLI is MIT-licensed with no such restriction.
        # Checksum verified against gitleaks' own published
        # gitleaks_8.30.1_checksums.txt for this exact asset.
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz -C /usr/local/bin gitleaks
      - name: gitleaks detect
        run: gitleaks detect --no-banner --redact

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        # Plain binary, not reviewdog/action-actionlint: that wrapper's
        # default reporter posts annotations via the Checks/PR-review API,
        # which needs permissions beyond this workflow's top-level
        # `contents: read` that couldn't be confirmed against the pinned
        # SHA without live testing. A plain binary run needs no permissions
        # beyond reading the checkout, and fails the job on lint errors
        # via its own exit code -- no separate `fail_level` input to trust.
        # Checksum verified against actionlint's own published
        # actionlint_1.7.12_checksums.txt for this exact asset.
        run: |
          curl -sSfLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz -C /usr/local/bin actionlint
      - name: actionlint
        run: actionlint

  # Argus must never depend on rh_lib (a private, RH-internal package) at
  # the code level — Argus is a standalone package. Scoped to *.py only:
  # five prompt files under argus/prompts/*.md intentionally mention
  # "rh_lib" verbatim, because they ship Redesign Health's production review
  # criteria as a worked example (see docs/CUSTOMIZING_PROMPTS.md) — that's
  # prose content for the LLM to read, not a code dependency, and scrubbing
  # it would misrepresent the prompts as something other than what they are.
  guard-rh-lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No rh_lib references in Python source
        run: |
          if grep -rn "rh_lib" --include="*.py" argus/ tests/; then
            echo "Found rh_lib references in Python code — argus must be a standalone package." >&2
            echo "(Prompt .md files are exempt — see the comment on this job in ci.yml.)" >&2
            exit 1
          fi

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-extras
      - name: pytest
        run: uv run pytest
